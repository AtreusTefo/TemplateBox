<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive CV and Resume Builder | TemplateBox</title>
    <meta name="description" content="Edit your resume live and export an ATS-friendly PDF with selectable text. Everything runs locally in your browser and saves automatically.">
    <link rel="canonical" href="https://templatebox.win/resume.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TemplateBox">
    <meta property="og:title" content="Interactive CV and Resume Builder | TemplateBox">
    <meta property="og:description" content="Edit your resume live and export an ATS-friendly PDF. Free, local, no sign-up.">
    <meta property="og:url" content="https://templatebox.win/resume.html">
    <meta property="og:image" content="https://templatebox.win/assets/og-resume.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- Twitter Card: without these every share renders as a bare link -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Interactive CV and Resume Builder | TemplateBox">
    <meta name="twitter:description" content="Edit your resume live and export an ATS-friendly PDF. Free, local, no sign-up.">
    <meta name="twitter:image" content="https://templatebox.win/assets/og-resume.png">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TemplateBox Resume Builder",
        "url": "https://templatebox.win/resume.html",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript and HTML5 support",
        "description": "Free browser-based CV and resume builder with a live preview and ATS-safe PDF export containing real selectable text. No account required and no data leaves the device.",
        "featureList": "Live preview, accent colour themes, automatic local save, selectable-text PDF export",
        "offers": { "@type": "Offer", "price": "0.00", "priceCurrency": "USD" }
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Templates", "item": "https://templatebox.win/" },
            { "@type": "ListItem", "position": 2, "name": "ATS Resume Template", "item": "https://templatebox.win/ats-resume-template.html" },
            { "@type": "ListItem", "position": 3, "name": "Resume Builder", "item": "https://templatebox.win/resume.html" }
        ]
    }
    </script>

    <!-- ================================================================
         MICROSOFT CLARITY: paste the Clarity tracking snippet directly
         below this comment block.
         ================================================================ -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "xix7m2758f");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts loaded without blocking render: the print-media swap defers
         application until the sheet has arrived, and font-display:swap in
         the served CSS paints text immediately in the fallback face. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
    <!-- Theme, applied before first paint so a returning visitor never sees a
         flash of the wrong one. Deliberately inline and synchronous: an
         external file would load after the first paint and the flash is
         exactly what this exists to prevent. The key is duplicated from
         js/app.js by necessity; tests/verify-layout.js asserts they match. -->
    <script>
        (function () {
            try {
                var saved = window.localStorage.getItem("tb_theme");
                var dark = saved
                    ? saved === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (err) {
                /* Storage blocked: fall through to the prefers-color-scheme
                   rules in the stylesheet, which key on the attribute being
                   absent. */
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Compilation engine: jsPDF native text API via clean CDN link.
         Chosen over html2pdf.js because html2pdf renders through html2canvas,
         which rasterizes text and breaks ATS machine scanning. See
         docs/error-fixes/RESUME_PDF_RASTERIZED_TEXT_FIX.md -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
            integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
            crossorigin="anonymous" defer></script>
</head>
<body>

    <header class="site-header editor-bar">
        <a class="editor-home" href="index.html" title="All templates" aria-label="All templates"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></a>

        <label class="sr-only" for="doc-name">Resume name</label>
        <input type="text" class="doc-name" id="doc-name" maxlength="80" value="Untitled resume" aria-label="Resume name">

        <div class="editor-actions">
            <span class="save-cloud" id="save-state" role="status" aria-live="polite" title="Saves automatically">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 18.5A3.5 3.5 0 0 1 6 11.6a5 5 0 0 1 9.7-1.5A4 4 0 0 1 18.5 18.5Z"/><path class="tick" d="m9.5 14 2 2 3.5-3.5"/></svg>
                <span class="sr-only" data-save-label>Saves automatically</span>
            </span>

            <button type="button" class="btn dl-toggle" id="download-pdf"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/></svg>Download PDF</button>
        </div>

        <nav class="site-nav" aria-label="Primary">
        </nav>
    </header>

    <main data-ads-static>
        <div class="editor-head">
            <h1 class="sr-only">Interactive CV and Resume Builder</h1>
            <!-- The autosave indicator moved into the toolbar above as an icon.
                 There is deliberately no second copy here: js/app.js targets
                 #save-state by id, so two would leave one of them permanently
                 stale. -->
        </div>

        <!-- Mobile-only tab switcher between form and preview -->
        <div class="mobile-tabs" role="tablist" aria-label="Editor views">
            <button type="button" id="tab-edit" class="is-active" aria-selected="true">Edit Form</button>
            <button type="button" id="tab-preview" aria-selected="false">Live Preview</button>
        </div>


        <!-- 728x90 leaderboard for the band too narrow for a rail (48rem to
             84rem). Exactly one unit per page: this and the rail are mutually
             exclusive by viewport, never both. -->
        <div class="editor-leaderboard" data-ad-editor-leaderboard aria-label="Advertisement"></div>

        <div class="editor-shell">
        <div class="editor-layout show-edit" id="editor-layout">

            <!-- Left pane: input form -->
            <section class="editor-pane" aria-label="Resume form">
                <h2>Accent Color</h2>
                <div class="swatch-row" id="swatch-row" aria-label="Accent color choices">
                    <button type="button" class="swatch is-active" data-accent="#1A1A1A" style="background-color:#1A1A1A" aria-label="Charcoal accent"></button>
                    <button type="button" class="swatch" data-accent="#1F4E79" style="background-color:#1F4E79" aria-label="Navy accent"></button>
                    <button type="button" class="swatch" data-accent="#2E5E4E" style="background-color:#2E5E4E" aria-label="Forest accent"></button>
                    <button type="button" class="swatch" data-accent="#7A2E2E" style="background-color:#7A2E2E" aria-label="Burgundy accent"></button>
                    <button type="button" class="swatch" data-accent="#8A6D1D" style="background-color:#8A6D1D" aria-label="Gold accent"></button>
                </div>

                <!-- Section jump list, built by initFormNav() in js/app.js
                     from the fieldsets below. Anchors, not tabs: nothing is
                     hidden, so no section can be missed before export. -->
                <nav class="form-nav" data-form-nav aria-label="Form sections" hidden></nav>
                <form id="resume-form" autocomplete="on">
                    <fieldset>
                        <legend>Personal Details</legend>
                        <div class="field">
                            <label for="f-name">Full Name</label>
                            <input type="text" id="f-name" data-bind="name" maxlength="50" required>
                        </div>
                        <div class="field">
                            <label for="f-title">Professional Title</label>
                            <input type="text" id="f-title" data-bind="title" maxlength="60">
                        </div>
                        <div class="field">
                            <label for="f-email">Email</label>
                            <input type="email" id="f-email" data-bind="email" maxlength="100">
                        </div>
                        <div class="field">
                            <label for="f-phone">Phone</label>
                            <input type="tel" id="f-phone" data-bind="phone" maxlength="30">
                        </div>
                        <div class="field">
                            <label for="f-location">Location</label>
                            <input type="text" id="f-location" data-bind="location" maxlength="60">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Professional Summary</legend>
                        <div class="field">
                            <label for="f-summary">Summary</label>
                            <textarea id="f-summary" data-bind="summary" maxlength="600" rows="4"></textarea>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Work Experience</legend>
                        <div id="experience-list"></div>
                        <button type="button" class="btn btn-secondary btn-block" id="add-experience">Add Experience Entry</button>
                    </fieldset>

                    <fieldset>
                        <legend>Education</legend>
                        <div id="education-list"></div>
                        <button type="button" class="btn btn-secondary btn-block" id="add-education">Add Education Entry</button>
                    </fieldset>

                    <fieldset>
                        <legend>Skills</legend>
                        <div class="field">
                            <label for="f-skills">Skills (comma separated)</label>
                            <input type="text" id="f-skills" data-bind="skills" maxlength="300">
                        </div>
                    </fieldset>
                </form>
            </section>

            <!-- Right pane: live document preview and export -->
            <section class="preview-pane" aria-label="Live resume preview">
                <h2>Live Preview</h2>
                <div class="resume-sheet" id="resume-sheet"></div>
                <!-- Download moved into the editor-bar toolbar above, to match
                     the other editors. -->
                <div class="preview-actions">
                    <p class="upload-hint">Exports locally as selectable vector text via jsPDF. No file ever leaves your device.</p>
                </div>
            </section>

        </div>

            <!-- Ad rail. Three stacked slots on very wide screens, each with
                 its own zone key; a single 160x600 on merely wide ones. Slots
                 are filled by js/ads.js and render nothing when dormant. -->
            <aside class="editor-rail" data-ad-editor-rail aria-label="Advertisements">
                <div data-ad-rail-slot></div>
                <div data-ad-rail-slot></div>
                <div data-ad-rail-slot></div>
            </aside>
        </div>

    </main>

    <!-- Repeating-entry row templates (cloned by resume.js; static markup
         only, user data is always injected through textContent bindings) -->
    <template id="tpl-experience">
        <div class="entry-row" data-entry>
            <div class="field">
                <label>Job Title</label>
                <input type="text" data-entry-field="role" maxlength="60">
            </div>
            <div class="field">
                <label>Company</label>
                <input type="text" data-entry-field="company" maxlength="60">
            </div>
            <div class="field">
                <label>Dates</label>
                <input type="text" data-entry-field="dates" maxlength="40" placeholder="2022 - Present">
            </div>
            <div class="field">
                <label>Description</label>
                <textarea data-entry-field="description" maxlength="400" rows="3"></textarea>
            </div>
            <button type="button" class="entry-remove" data-entry-remove>Remove Entry</button>
        </div>
    </template>

    <template id="tpl-education">
        <div class="entry-row" data-entry>
            <div class="field">
                <label>Degree or Certificate</label>
                <input type="text" data-entry-field="degree" maxlength="80">
            </div>
            <div class="field">
                <label>Institution</label>
                <input type="text" data-entry-field="school" maxlength="80">
            </div>
            <div class="field">
                <label>Dates</label>
                <input type="text" data-entry-field="dates" maxlength="40" placeholder="2018 - 2022">
            </div>
            <button type="button" class="entry-remove" data-entry-remove>Remove Entry</button>
        </div>
    </template>

    <!-- 320x50 anchor, phones only. Fixed to the foot of the viewport for the
         whole editing session. js/ads.js adds .has-ad-anchor to <body> when it
         fills, which reserves the space and lifts the sticky export bar clear
         of it; without that the ad would sit on top of the Download button. -->
    <div class="editor-anchor" data-ad-editor-anchor aria-label="Advertisement"></div>

    <script src="js/ads.js"></script>
    <script src="js/app.js"></script>
    <script src="js/resume.js"></script>
</body>
</html>
