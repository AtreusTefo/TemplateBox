<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>No connection | TemplateBox</title>

    <!-- ================================================================
         THIS PAGE MUST NOT REFERENCE A SINGLE OTHER FILE. EVER.

         sw.js serves it in place of a navigation that could not reach the
         network. At that moment nothing else can be fetched either, so a
         <link> to css/style.css, a Google Fonts stylesheet, an <img> for
         the mark or a <script src> for anything at all would come back
         empty and this page would render as unstyled black-on-white --
         which looks MORE broken than the browser's own error screen, and
         so defeats the only reason the page exists.

         That is why the styling is inline, the mark is an inline <svg>,
         the typeface is the system stack rather than Inter, and there is
         no js/ads.js, no js/app.js, no manifest link and no favicon link.
         Every one of those is a deliberate omission, not an oversight, and
         a refactor that "tidies" this page onto the shared stylesheet
         silently breaks it in the one state it is built for. You cannot
         notice that by looking at the page; you have to be offline.

         Also deliberately unadvertised. The visitor has no network, so no
         ad call could complete anyway -- there is no impression being
         given up here, only a failed request that would delay the paint.

         Full reasoning: docs/implementation/PWA_INSTALLABLE_APP.md
         ================================================================ -->

    <!-- Theme before first paint, the same contract every other page has:
         same tb_theme key, same prefers-color-scheme fallback, same
         data-theme attribute. Duplicated by necessity -- an external file
         cannot be loaded here at all, which is a stronger version of the
         reason the other pages inline it too. -->
    <script>
        (function () {
            try {
                var saved = window.localStorage.getItem("tb_theme");
                var dark = saved
                    ? saved === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (err) {
                /* Storage blocked: the prefers-color-scheme rule below still
                   applies, keyed on the attribute being absent. */
            }
        })();
    </script>

    <style>
        /* Palette lifted from css/style.css. These are the --l-* and --d-*
           source values, not the --color-* aliases, because there is no
           stylesheet here to alias through. If the brand palette changes,
           this is the one place off the main sheet that has to move with it. */
        :root {
            --bg: #F4F3EF;
            --text: #1A1A1A;
            --card: #FFFFFF;
            --border: #EAE8E3;
            --muted: #6B6B66;
            --brand: #8A5A2B;
        }

        :root[data-theme="dark"] {
            --bg: #14130F;
            --text: #F2F0EA;
            --card: #1D1C17;
            --border: #3A382F;
            --muted: #A8A59B;
            --brand: #C8925A;
        }

        /* Only for a browser that blocked storage, so the script above could
           not set the attribute. :not([data-theme]) keeps it from overriding
           an explicit light choice. */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --bg: #14130F;
                --text: #F2F0EA;
                --card: #1D1C17;
                --border: #3A382F;
                --muted: #A8A59B;
                --brand: #C8925A;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            /* System stack, not Inter. The webfont cannot be fetched with no
               network, and naming it would only cost a failed lookup before
               falling back to exactly this. */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            /* dvh so the panel stays centred when a mobile browser's own
               error chrome or address bar changes the visible height. */
            min-height: 100dvh;
            padding: 1.5rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .panel {
            width: 100%;
            /* 26rem, not a viewport fraction: this is one short paragraph and
               a button, and it should read as a card at 320px and at 1920px
               alike rather than stretching into a line of text nobody can
               track. */
            max-width: 26rem;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2.25rem 1.75rem;
            text-align: center;
        }

        .mark {
            width: 3rem;
            height: 3.375rem;
            margin: 0 auto 1.5rem;
            display: block;
            /* currentColor, so the mark follows the theme. The standalone
               assets/logo-mark.svg hardcodes its ink because a favicon has no
               text to inherit from; inlined here, it does. */
            color: var(--text);
        }

        h1 {
            font-size: 1.375rem;
            font-weight: 600;
            margin: 0 0 0.75rem;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 1rem;
            color: var(--muted);
            font-size: 0.9375rem;
        }

        /* The reassurance is the reason this page beats the browser's error
           screen, so it is not muted body copy. Someone who taps the icon on
           a train and sees a crash assumes their half-finished resume is
           gone; this line is the difference between "the internet is down"
           and "this app lost my work". */
        .safe {
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            margin: 0 0 1.5rem;
            font-size: 0.875rem;
        }

        button {
            font: inherit;
            font-weight: 600;
            color: var(--bg);
            background: var(--text);
            border: 1px solid var(--text);
            padding: 0.6875rem 1.5rem;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background: var(--brand); border-color: var(--brand); }

        button:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
        }

        .status {
            margin: 1rem 0 0;
            font-size: 0.8125rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <main class="panel">
        <!-- assets/logo-mark.svg, inlined. See the note above on why it is not
             an <img>. stroke is currentColor here rather than the file's own
             #1A1A1A so it survives the dark theme. -->
        <svg class="mark" viewBox="0 0 64 72" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="TemplateBox">
            <g fill="none" stroke="currentColor" stroke-width="4"
               stroke-linejoin="miter" stroke-linecap="butt">
                <path d="M32 3 L60 19 L60 53 L32 69 L4 53 L4 19 Z"/>
                <path d="M32 3 L32 36"/>
                <path d="M32 36 L4 19"/>
                <path d="M32 36 L60 53"/>
            </g>
        </svg>

        <h1>You are offline</h1>

        <p>TemplateBox needs a connection to open. Reconnect and this page will
            carry on where you were headed.</p>

        <p class="safe">Your saved work is still on this device. Nothing was
            lost, and it will be waiting when you are back online.</p>

        <button type="button" id="retry">Try again</button>

        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        (function () {
            var retry = document.getElementById("retry");
            var status = document.getElementById("status");

            /* reload() re-requests the URL the visitor was actually navigating
               to, not this file: sw.js answered that navigation with this
               body, so location still holds the original address and the
               address bar never changed. Retrying therefore lands them where
               they were going rather than on the homepage. */
            retry.addEventListener("click", function () {
                status.textContent = "Reconnecting...";
                window.location.reload();
            });

            /* Saves the visitor having to notice. The event fires on regaining
               an interface, which is not the same as reaching the internet --
               a captive portal fires it too -- so a failed reload simply lands
               back here, which is the correct outcome either way. */
            window.addEventListener("online", function () {
                status.textContent = "Back online. Reloading...";
                window.location.reload();
            });
        })();
    </script>
</body>
</html>
