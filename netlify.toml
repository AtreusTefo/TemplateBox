# The deployable site lives in site/, which is the web root: /index.html is
# site/index.html. Documentation, specifications and instruction files sit
# outside it and are therefore never uploaded, which is a structural guarantee
# rather than a rule that has to be maintained (see
# docs/error-fixes/INTERNAL_FILES_PUBLICLY_SERVED.md for the earlier
# 404-rule approach this replaced). Still no build step: drag the site folder
# into Netlify, or let the Git integration publish it.
[build]
  publish = "site"
  command = ""

# Blog posts moved from the JavaScript-rendered ?slug= route to static files
# under blog/, which carry real metadata in the served markup. A 301 (rather
# than a noindex on post.html) consolidates any ranking signal the old URLs
# already accumulated onto the new ones instead of discarding it.
#
# The rule keys on the slug query parameter, so the admin panel's draft
# preview at post.html?draft=<slug>&preview=1 is not matched and still
# renders through post.html, which is what a not-yet-exported draft needs.
[[redirects]]
  from = "/post.html"
  to = "/blog/:slug.html"
  status = 301
  force = true
  [redirects.query]
    slug = ":slug"

# No 404 rules are needed for internal files any more. Documentation,
# specifications, instruction files and the local-server config all sit outside
# site/, so they are not in the deploy at all -- a structural guarantee rather
# than a list of paths to keep extending. serve.json lives at the repository
# root and points `serve` at site/ through its own "public" field, which is why
# it no longer needs to ship inside the publish directory.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Private authoring tool. Enforced with a response header rather than a
# robots.txt Disallow: a Disallow prevents the crawler from fetching the page
# at all, which prevents it from ever reading the page's own noindex meta tag,
# leaving the URL indexable on the strength of an external link. A header is
# delivered with the response itself and cannot be missed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The interstitial already carries a noindex meta tag; the header makes the
# exclusion authoritative for crawlers that skip meta parsing.
[[headers]]
  for = "/loading.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Internal maintenance tools (Open Graph card generator). Deployed with the
# site because there is no build step to strip them, so excluded by header.
[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The offline notice sw.js serves in place of a navigation that could not
# reach the network. Not a page of the site in any meaningful sense: it has no
# canonical, no content and nothing to rank, and an indexed "You are offline"
# result would be actively misleading. Same header-not-Disallow reasoning as
# every exclusion above -- a Disallow would stop the crawler reading the page's
# own noindex meta tag.
[[headers]]
  for = "/offline.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The service worker script.
#
# THIS RULE WORKS. CLOUDFLARE OVERRIDES IT ANYWAY, AND THAT IS NOT A NETLIFY
# PROBLEM. Measured September 16, 2026:
#
#   https://templatebox.netlify.app/sw.js  ->  Cache-Control: no-cache
#   https://templatebox.win/sw.js          ->  Cache-Control: max-age=14400
#
# templatebox.win runs on Cloudflare nameservers and every response carries a
# cf-cache-status, so Cloudflare proxies the origin and its Browser Cache TTL
# (4 hours) replaces whatever Cache-Control Netlify sends on anything it
# caches. Fixing it means a Cloudflare Cache Rule for /sw.js set to respect
# the origin TTL, or to bypass cache. NOTHING IN THIS FILE CAN DO IT.
#
# Two traps this took, both worth not repeating:
#
# The first value here was `public, max-age=0, must-revalidate`, which is
# EXACTLY Netlify's own default for uncached types -- so at the origin it was
# indistinguishable from having no rule at all, and the conclusion drawn from
# that ("the rule is not applying") was wrong. `no-cache` is distinguishable,
# which is the only reason the origin could be proved correct. Prefer a value
# you can tell apart from the default when the whole point is to verify it.
#
# And the comparison that produced the wrong conclusion was made on the PUBLIC
# domain, where /sw.js and /js/app.js both read max-age=14400 and so looked
# identical. At the origin they differ. Comparing two things downstream of the
# same rewriter shows you the rewriter, not the things.
#
# Why this is survivable regardless: browsers deliberately bypass the HTTP
# cache when checking a worker script for an update, so a new sw.js reaches
# installed visitors whatever the header says. The bug it guards is a worker
# that cannot be replaced at all, which has no recovery path short of asking
# every installed visitor to clear their site data.
#
# SEPARATE AND LARGER: the same Cloudflare override applies to /js/app.js and
# /css/style.css, which leave the origin as `public,max-age=0,must-revalidate`
# and reach visitors as `max-age=14400`. So the site's scripts and stylesheet
# are held for up to four hours WITHOUT revalidating. sw.js's own header and
# CLAUDE.md both argue against precaching on the grounds that "Netlify's
# validators already revalidate" -- which is true of the origin and not true
# of what visitors get. That does not change the decision (four hours is
# bounded; a service-worker cache is not), but the stated reason is only half
# right, and a deploy can be up to four hours stale for a returning visitor.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Declared explicitly because the correct type for .webmanifest is not
# universally configured, and a manifest served as text/plain is ignored
# silently: the page stays installable-looking in DevTools while the install
# prompt never appears, which is a long afternoon to diagnose.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Search results. noindex but FOLLOW, unlike the two above: every template
# this page can list is already on index.html, so an indexable copy is a thin
# duplicate of the most-indexed page on the site and a ?q= URL is exactly the
# "substantially similar" page Search Central asks not to be given -- but the
# links out of it are real internal links and should still pass. The page
# carries the same meta tag; this header is what makes it authoritative for
# crawlers that skip meta parsing. Deliberately not a robots.txt Disallow: a
# Disallow prevents the crawler ever reading the page's own noindex.
[[headers]]
  for = "/search.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
